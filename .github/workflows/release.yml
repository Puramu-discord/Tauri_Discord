name: Release

# "v0.1.0" のようなタグを push した時だけ動く
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# GITHUB_TOKEN で Release を作成・アセットをアップロードするために必要
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"   # Apple Silicon + Intel 両対応ビルド
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04"   # .deb / .AppImage
            args: ""
          - platform: "windows-latest" # .msi / .exe (NSIS)
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust セットアップ
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal ビルド用に両ターゲットを追加
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust ビルドキャッシュ
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Linux用システム依存パッケージ
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: npm 依存関係インストール
        run: npm ci

      - name: Tauri ビルド & GitHub Release へアップロード
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "tauri-discord v__VERSION__"
          releaseBody: |
            ## tauri-discord ${{ github.ref_name }}

            自動ビルドされたインストーラーです。詳細は変更履歴を参照してください。
          releaseDraft: true   # 中身を確認してから手動で公開する
          prerelease: false
          args: ${{ matrix.args }}